<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="英文文法與 Science 自然複習：學期練習、名詞解釋、人類與植物的生殖、遺傳。">
  <meta name="keywords" content="English grammar, past tense, past simple, past perfect, grammar practice, ESL, learning English">
  
  <!-- Open Graph -->
  <meta property="og:title" content="TenseMaster - 英文與 Science 複習">
  <meta property="og:description" content="英文文法與自然複習，包含科學名詞解釋、重點整理、圖表判讀與綜合練習。">
  <meta property="og:type" content="website">
  
  <title>TenseMaster | 英文與 Science 複習</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div class="background-mesh"></div>
    <header>
      <div class="logo">
        <span class="icon">⚡</span>
        <h1>TenseMaster</h1>
      </div>
      <nav class="nav-controls">
        <button id="theme-toggle" class="theme-toggle" title="Toggle Dark/Light Mode">🌓</button>
        <button id="reset-btn" class="secondary-btn">重置分數</button>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h2>英文文法練習</h2>
        <p>選擇學期與練習範圍，依語境填入答案或合併完整句子。</p>
      </section>

      <section class="game-container">
        <div class="curriculum-controls glass">
          <label for="subject-select">科目
            <select id="subject-select">
              <option value="english">English 英文文法</option>
              <option value="science">Science 自然</option>
            </select>
          </label>
          <label for="semester-select">學期
            <select id="semester-select">
              <option value="current" selected>這學期（期中考）</option>
              <option value="previous">上學期</option>
            </select>
          </label>
          <label for="unit-select">練習範圍
            <select id="unit-select"></select>
          </label>
          <label id="science-mode-control" class="hidden" for="science-mode-select">複習方式
            <select id="science-mode-select">
              <option value="glossary">名詞解釋・閱讀與回想</option>
              <option value="review">重點整理</option>
              <option value="terms">名詞測驗・看定義填名詞</option>
              <option value="define">名詞解釋・書寫與自評</option>
              <option value="practice">應用練習・選擇／填充／排序／簡答</option>
            </select>
          </label>
          <p id="unit-summary" aria-live="polite"></p>
        </div>
        <section id="science-study" class="science-study glass hidden" aria-live="polite"></section>
        <div class="stats-bar glass">
          <div class="stat">
            <span class="label">累積分數</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="stat" style="position: relative;">
            <span class="label">連續答對</span>
            <span id="streak" class="value">0</span>
            <span id="streak-multiplier" class="multiplier-badge">x2</span>
          </div>
          <div class="stat">
            <span class="label">正確率</span>
            <span id="accuracy" class="value">0%</span>
          </div>
        </div>

        <div class="quiz-card glass" id="quiz-card">
          <div class="progress-indicator">
            <div id="progress-bar" class="progress-fill"></div>
          </div>
          <div class="question-header">
            <span id="question-category" class="category">載入題庫中…</span>
            <span id="current-tense-label" class="badge">練習</span>
          </div>
          
          <div class="question-content">
            <p id="question-instructions" class="question-instructions"></p>
            <div id="question-text" class="sentence"></div>
          </div>

          <div class="input-area">
            <button id="submit-btn" class="primary-btn">送出答案</button>
          </div>

          <div id="feedback" class="feedback hidden">
            <div class="feedback-icon"></div>
            <div class="feedback-text">Correct!</div>
          </div>
        </div>

        <div class="controls">
          <button id="next-btn" class="primary-btn hidden">下一題 &rarr;</button>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 TenseMaster Academy. Advanced Grammar Logic System.</p>
    </footer>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
